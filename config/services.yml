parameters:
  env(APP_ENV): 'dev'
  env(APP_VENDOR): 'unknown'
  env(APP_NAME): 'unknown'
  env(APP_VERSION): 'N.N.N'
  env(APP_BUILD): 'YYYYMMDDHHSS'
  env(APP_DEPLOYMENT_ID): 'YYYYMMDDHHSS'
  env(APP_DEV_BRANCH): 'master'
  env(SYSTEM_MAC_ADDRESS): ''
  env(CLOUD_PROVIDER): 'private'
  env(CLOUD_REGION): 'unknown'
  env(CLOUD_ZONE): 'unknown'
  env(CLOUD_INSTANCE_ID): 'unknown'
  env(CLOUD_INSTANCE_TYPE): 'unknown'

  app_env: '%env(APP_ENV)%'
  app_vendor: '%env(APP_VENDOR)%'
  app_name: '%env(APP_NAME)%'
  app_version: '%env(APP_VERSION)%'
  app_build: '%env(APP_BUILD)%'
  app_deployment_id: '%env(APP_DEPLOYMENT_ID)%'
  app_dev_branch: '%env(APP_DEV_BRANCH)%'
  system_mac_address: '%env(SYSTEM_MAC_ADDRESS)%'
  cloud_provider: '%env(CLOUD_PROVIDER)%'
  cloud_region: '%env(CLOUD_REGION)%'
  cloud_zone: '%env(CLOUD_ZONE)%'
  cloud_instance_id: '%env(CLOUD_INSTANCE_ID)%'
  cloud_instance_type: '%env(CLOUD_INSTANCE_TYPE)%'

  gdbots_app.default_device_view: 'desktop'
  gdbots_app.enabled_device_views:
    - 'desktop'
    - 'smartphone'
    - 'featurephone'
    - 'smarttv'
    - 'smartwatch'
    - 'app'
    - 'tablet'
    - 'robot'

services:
  Gdbots\Bundle\AppBundle\Command\:
    resource: '../src/Command/*'
    autoconfigure: true
    autowire: true
    tags:
      - { name: console.command }

  gdbots_app.device_view_subscriber:
    class: Gdbots\Bundle\AppBundle\EventSubscriber\DeviceViewSubscriber
    public: false
    arguments:
      - '@gdbots_app.device_view_resolver'
    tags:
      - { name: kernel.event_subscriber }

  gdbots_app.response_tokens_subscriber:
    class: Gdbots\Bundle\AppBundle\EventSubscriber\ResponseTokensSubscriber
    public: false
    tags:
      - { name: kernel.event_subscriber }

  gdbots_app.device_view_resolver:
    class: Gdbots\Bundle\AppBundle\DeviceViewResolver
    public: true
    arguments:
      - '%gdbots_app.default_device_view%'
      - '%gdbots_app.enabled_device_views%'

  gdbots_app.twig.app_extension:
    class: Gdbots\Bundle\AppBundle\Twig\AppExtension
    public: false
    arguments:
      - '@service_container'
    tags:
      - { name: twig.extension }
